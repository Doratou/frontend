name: Doratou CI

on:
  push:
    branches:
      - main
      - develop
      # - feat/ci-cd

  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: doratou/frontend

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log into GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: image
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=develop" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  update-gitops:
    name: Update GitOps Repository
    runs-on: ubuntu-latest

    needs: build

    if: github.event_name == 'push'

    permissions:
      contents: read

    steps:
      - name: Checkout DevOps Repository
        uses: actions/checkout@v4
        with:
          repository: Doratou/Devops
          ref: main
          token: ${{ secrets.DEVOPS_REPO_TOKEN }}
          path: devops

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update Frontend Image Tag
        working-directory: devops
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          yq -i '.web.image.tag = strenv(IMAGE_TAG)' \
            helm/app/values.yaml

      - name: Commit and Push GitOps Changes
        working-directory: devops
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/app/values.yaml

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "chore(gitops): update frontend to ${IMAGE_TAG:0:7}"

          git push origin main
